name: CloudSeed
options:
  bundleIdPrefix: com.yourname
targets:
  CloudSeed:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CloudSeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.cloudseed
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: CloudSeed
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
